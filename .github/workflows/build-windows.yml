name: Build Windows Executable

on: [push, workflow_dispatch]

jobs:
  build:
    runs-on: windows-latest

    steps:
    - uses: actions/checkout@v4
    - name: Set up Python
      uses: actions/setup-python@v4
      with:
        python-version: '3.x'
    - name: Install dependencies
      run: |
        python -m pip install --upgrade pip
        pip install -r requirements.txt
    - name: Run core and Qt regression tests
      shell: pwsh
      run: |
        python -m unittest -q test_core.py
        $env:QT_QPA_PLATFORM = "offscreen"
        python -m unittest -q test_qt_gui.py
    - name: Build with PyInstaller
      run: |
        # PyInstaller را با استفاده از ماژول پایتون اجرا می‌کنیم تا مسیر آن به درستی پیدا شود.
        python -m PyInstaller --noconfirm --clean --onefile --windowed --name rss_reader --icon assets/rss-reader-pro.ico --add-data "assets;assets" qt_gui.py
    - name: Upload artifact
      uses: actions/upload-artifact@v4
      with:
        name: rss-reader-windows-exe
        path: dist/rss_reader.exe
