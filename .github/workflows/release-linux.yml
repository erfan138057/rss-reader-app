name: Build and Release Linux Package

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-linux:
    runs-on: ubuntu-22.04
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: Install Qt platform dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y libxcb-cursor0 libxcb-icccm4 libxcb-keysyms1

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install pyinstaller
          python -m pip install -r requirements.txt

      - name: Build portable Linux executable
        run: |
          python -m PyInstaller --noconfirm --clean --onefile --windowed \
            --name "RSS-Reader-Pro" \
            --add-data "assets:assets" \
            qt_gui.py

      - name: Package Linux archive
        run: |
          chmod +x tools/package_linux.sh
          tools/package_linux.sh "${{ github.ref_name }}"

      - name: Smoke-test packaged executable
        run: |
          archive="dist/RSS-Reader-Pro-${{ github.ref_name }}-linux-x86_64.tar.gz"
          test -f "$archive"
          tar -tzf "$archive" | grep -q "RSS-Reader-Pro-${{ github.ref_name }}-linux-x86_64/RSS-Reader-Pro"

      - name: Upload Linux package to Release
        uses: svenstaro/upload-release-action@v2
        with:
          repo_token: ${{ secrets.GITHUB_TOKEN }}
          file: ./dist/RSS-Reader-Pro-${{ github.ref_name }}-linux-x86_64.tar.gz
          asset_name: RSS-Reader-Pro-${{ github.ref_name }}-linux-x86_64.tar.gz
          tag: ${{ github.ref_name }}
          overwrite: true
