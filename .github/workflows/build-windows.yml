name: Build Windows Executable

on: [push, workflow_dispatch]

jobs:
  build:
    runs-on: windows-latest

    steps:
    - uses: actions/checkout@v4 # به v4 به‌روز شد
    - name: Set up Python
      uses: actions/setup-python@v4
      with:
        python-version: '3.x'
    - name: Install dependencies
      run: |
        python -m pip install --upgrade pip
        pip install -r requirements.txt
    - name: Build with PyInstaller
      run: |
        # برای PyInstaller باید فایل‌های اصلی رو بهش داد
        # در این حالت، gui.py
        # core.py و config.py به صورت خودکار توسط gui.py ایمپورت می‌شوند
        pyinstaller --onefile --windowed --name rss_reader gui.py
    - name: Upload artifact
      uses: actions/upload-artifact@v4 # به v4 به‌روز شد
      with:
        name: rss-reader-windows-exe
        path: dist/rss_reader.exe
